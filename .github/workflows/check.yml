name: Checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Validate distribution archive
        run: |
          find contents -type f \( -name '*.qml' -o -name '*.mjs' -o -name '*.svg' -o -name '*.xml' \) | LC_ALL=C sort | zip -X kryptotrack.plasmoid metadata.json -@
          bun scripts/check-package.mjs kryptotrack.plasmoid
